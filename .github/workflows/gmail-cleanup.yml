name: Gmail - Arquivar mensagens lidas

on:
  schedule:
    # Mantem o intervalo de 5 minutos, mas evita o inicio exato da hora,
    # quando o GitHub Actions costuma ter maior carga.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Somente simular, sem arquivar"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: gmail-auto-organizer
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Arquivar mensagens lidas
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python gmail_cleanup.py
